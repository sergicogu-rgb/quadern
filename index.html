<!doctype html><html lang="ca"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}
#login{position:fixed;inset:0;z-index:50;background:var(--bg,#0e1114);color:var(--fg,#eef1f4);overflow:auto;padding:calc(40px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.lgin{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.lgbrand{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase}.lgbrand i{font-style:normal;color:var(--accent,#5b8cff)}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="store.js"></script>
</head><body>
<title>Quadern d'Entrenament</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: app mòbil fosca d'una columna. Inici amb la rutina del dia; mode sessió amb un exercici cada vegada i barra d'accions fixa a baix */
:root{
  --bg:#0e1114; --surface:#171b20; --raise:#20262d; --fg:#eef1f4; --muted:#8d97a3; --line:#2a3139;
  --accent:#5b8cff; --accent-ink:#ffffff; --accent-soft:#1b2541;
  --good:#3ecf8e; --good-ink:#06281a; --good-soft:#11291f; --warn:#f5b04c; --warn-soft:#30250f; --bad:#ff6b6b; --bad-soft:#341619;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f2f3f5; --surface:#ffffff; --raise:#eceef1; --fg:#12161a; --muted:#5b6571; --line:#d8dce1;
  --accent:#2f5fe0; --accent-ink:#ffffff; --accent-soft:#e3eaff;
  --good:#13804f; --good-ink:#ffffff; --good-soft:#dcf3e7; --warn:#9a5b00; --warn-soft:#fbeed6; --bad:#c62828; --bad-soft:#fde3e3; color-scheme:light }}
:root[data-theme="light"]{
  --bg:#f2f3f5; --surface:#ffffff; --raise:#eceef1; --fg:#12161a; --muted:#5b6571; --line:#d8dce1;
  --accent:#2f5fe0; --accent-ink:#ffffff; --accent-soft:#e3eaff;
  --good:#13804f; --good-ink:#ffffff; --good-soft:#dcf3e7; --warn:#9a5b00; --warn-soft:#fbeed6; --bad:#c62828; --bad-soft:#fde3e3; color-scheme:light }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.02;text-wrap:balance}
h1{font-size:40px;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:30px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
h3{font-size:21px;font-weight:700;letter-spacing:.01em}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.sub{color:var(--muted);margin:0;font-size:15px}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 140px;min-width:0}
label.f{display:flex;flex-direction:column;gap:5px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--raise);color:var(--fg);padding:11px 16px;font-weight:600;touch-action:manipulation}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.good{background:var(--good);border-color:var(--good);color:var(--good-ink)}
button.ghost{background:transparent;border-style:dashed;color:var(--muted)}
button.plain{background:transparent;border-color:transparent;color:var(--muted);padding:8px 10px}
button.danger{color:var(--bad);background:transparent}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.empty{border:1px dashed var(--line);border-radius:18px;padding:24px 16px;color:var(--muted);text-align:center}
.empty b{color:var(--fg);display:block;margin-bottom:4px;font-family:var(--display);font-size:22px;font-weight:700}
.note{padding:11px 14px;border-radius:12px;font-size:14px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--line)}
#status{margin-top:12px} #status:empty{display:none}
.up{color:var(--good)} .down{color:var(--bad)}

/* capçalera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 10px}
.brand{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand i{font-style:normal;color:var(--accent)}
.top .lbl{text-align:right}
.wotop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;width:100%}
.wotop .clock{font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:pulse 1.4s infinite;flex-shrink:0}
@keyframes pulse{50%{opacity:.25}}
.wotop .pos{border-radius:999px;padding:7px 14px;font-family:var(--display);font-size:18px;font-weight:700}
.wotop .fin{justify-self:end;padding:9px 14px}
.live{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:10px 12px;margin-top:4px}
.live span{display:flex;align-items:center;gap:8px;font-weight:600}

/* inici */
.hello{display:flex;flex-direction:column;gap:2px;margin:6px 0 14px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;border:26px solid var(--accent-soft);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:relative;z-index:1}
.tag{display:inline-block;font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:3px 10px;border-radius:999px}
.hero h2{font-size:36px;position:relative;z-index:1}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li{display:grid;grid-template-columns:24px minmax(0,1fr) 26px;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.plist .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.plist .k{font-family:var(--display);font-weight:700;color:var(--muted);font-size:17px}
.plist .nm{font-weight:600;font-size:15px;line-height:1.2;min-width:0}
.plist .tg{font-size:14px;color:var(--muted)}
.bd{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;font-weight:700;font-size:14px;background:var(--raise);color:var(--muted)}
.bd.up{background:var(--good-soft);color:var(--good)} .bd.down{background:var(--bad-soft);color:var(--bad)}
button.go{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:16px;border-radius:16px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border-radius:999px;padding:8px 14px;font-size:14px;color:var(--muted)}
.chips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.done-banner{display:flex;align-items:center;gap:12px;background:var(--good-soft);border:1px solid var(--good);border-radius:18px;padding:14px 16px}
.done-banner .ok{flex-shrink:0;width:38px;height:38px;border-radius:50%;background:var(--good);color:var(--good-ink);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.done-banner>div{min-width:0}
.quick{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.quick .val{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.quick .val small{font-size:17px;color:var(--muted);font-weight:600}
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.mini a{text-decoration:none;color:var(--fg);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:12px}
.mini a.today{background:var(--raise)}
.mini .w{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.mini .d{font-family:var(--display);font-size:20px;font-weight:700;line-height:1}
.mini i,.day i{width:8px;height:8px;border-radius:50%}
i.done{background:var(--good)} i.plan{border:2px solid var(--accent)} i.miss{background:var(--line)} i.none{visibility:hidden}

/* stepper */
.step{display:grid;grid-template-columns:32px minmax(0,1fr) 32px;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.step button{border:0;border-radius:0;background:transparent;padding:0;height:48px;font-size:24px;font-weight:500;color:var(--muted)}
.step button:active{background:var(--line)}
.step input{border:0;border-radius:0;background:transparent;text-align:center;padding:0;height:48px;font-family:var(--display);font-size:23px;letter-spacing:-.01em;font-weight:700;font-variant-numeric:tabular-nums}
.step input.t{color:var(--accent)}
.step.lg{grid-template-columns:56px minmax(0,1fr) 56px}
.step.lg button,.step.lg input{height:64px} .step.lg input{font-size:36px}

/* mode sessió */
.seg{display:flex;gap:4px;margin:2px 0 14px}
.seg button{flex:1 1 0;height:6px;padding:0;border:0;border-radius:3px;background:var(--line)}
.seg button.part{background:var(--accent-soft)} .seg button.done{background:var(--good)} .seg button.cur{background:var(--accent)}
.photo{display:block;width:100%;max-width:100%;aspect-ratio:16/10;border-radius:18px;overflow:hidden;background:var(--raise);border:1px dashed var(--line);padding:0;color:var(--muted);font-weight:600}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.has{border-style:solid}
.photo.small{aspect-ratio:auto;height:76px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exhead>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.exhead h2{font-size:30px}
.chip{display:inline-flex;align-self:flex-start;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px}
.why{font-size:14px;padding:11px 13px;border-radius:14px;background:var(--accent-soft);line-height:1.35}
.why.upg{background:var(--good-soft)} .why.dn{background:var(--bad-soft)}
.why b{font-weight:700}
.last{font-size:14px;color:var(--muted)}
.last b{color:var(--fg);font-weight:600}
.sethead,.setrow{display:grid;grid-template-columns:40px minmax(0,1.2fr) minmax(0,1fr) 48px;gap:6px;align-items:center}
.sethead span{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:center}
.setrow{padding:8px;margin:0 -8px;border-radius:16px;transition:background .15s}
.setrow.done{background:var(--good-soft)}
.setrow.done .step{border-color:transparent;background:transparent}
.setrow.done .step button{visibility:hidden}
.sn{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.sn b{font-family:var(--display);font-size:22px}
.sn small{font-size:11px;color:var(--muted);font-weight:600}
.sn button{margin-top:3px;padding:2px 5px;font-size:10px;border-radius:6px;font-weight:700;letter-spacing:.04em;color:var(--muted);background:transparent}
.sn button.on{color:var(--warn);border-color:var(--warn)}
.chk{height:48px;width:48px;padding:0;border-radius:14px;font-size:22px;font-weight:800;color:var(--muted);background:var(--raise)}
.setrow.done .chk{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.sets{display:flex;flex-direction:column;gap:2px}
.wobar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wobar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:56px 1fr;gap:10px}
.wobar button{height:56px;font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:16px}
.wobar .main.ready{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:calc(100% - 32px)}
.rest .t{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.rest .l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.rest button{white-space:nowrap;background:transparent;color:inherit;border-color:currentColor;padding:7px 11px;border-radius:999px;font-size:14px}
.rest.end{background:var(--good);color:var(--good-ink)}

.cmp{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:2px 2px 0 48px;color:var(--muted)}
.cmp.up{color:var(--good)} .cmp.down{color:var(--bad)}
.cmp .pr{margin-left:0}
.cmp.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:translateY(-4px);opacity:0}100%{transform:none;opacity:1}}
/* any */
.yearnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.yearnav strong{font-family:var(--display);font-size:28px;font-weight:800}
.months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
.mon{min-width:0}
.mon .mn{font-family:var(--display);font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:flex;justify-content:space-between;align-items:baseline}
.mon .mn small{font-family:var(--body);font-size:11px;color:var(--good);font-weight:700;letter-spacing:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal span,.cal button{aspect-ratio:1;border-radius:3px;background:var(--raise);padding:0;border:0;min-width:0}
.cal span.x{background:transparent}
.cal button.s{background:var(--good)}
.cal button.t{outline:2px solid var(--accent);outline-offset:-1px}
.cal button.f{opacity:.35}
.ylegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.ylegend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* resum */
.sumhero{text-align:center;padding:26px 16px;display:flex;flex-direction:column;gap:6px;align-items:center}
.sumhero .ok{width:62px;height:62px;border-radius:50%;background:var(--good);color:var(--good-ink);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;margin-bottom:6px}
.sumhero .dur{font-size:64px;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.tile .v{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:15px;font-weight:600;color:var(--muted)}
.pr{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--good);background:var(--good-soft);padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right}
.tw{overflow-x:auto}

/* fulls inferiors */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:88%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet .btns{display:flex;flex-direction:column;gap:8px}
.sheet .btns button{padding:15px;font-size:17px}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.exlist button{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:12px;border-radius:14px}
.exlist button.cur{border-color:var(--accent)}
.exlist .st{font-size:13px;color:var(--muted);font-weight:600}
.exlist .st.ok{color:var(--good)}
.navlinks{display:flex;gap:8px;flex-wrap:wrap}
.navlinks a{flex:1 1 0;text-align:center;text-decoration:none;color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:600;font-size:14px}

/* pestanyes */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:7px 2px;border-radius:12px}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* altres vistes */
.vhead{display:flex;flex-direction:column;gap:4px;margin:6px 0 16px}
.chartbox{position:relative;height:250px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.plst{display:flex;flex-direction:column;gap:8px}

.prow .nm{font-weight:600;font-size:15px;line-height:1.2}

.pth{width:44px;height:44px;border-radius:10px;overflow:hidden;background:var(--raise);display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--display);font-weight:700;font-size:18px}

.grp{margin-top:8px}

.day .d{font-family:var(--display);font-size:22px;font-weight:800;line-height:1}

.plancard{display:flex;justify-content:space-between;align-items:center;gap:12px}

.sess{display:flex;flex-direction:column;gap:10px}

.sess li{display:flex;gap:10px;justify-content:space-between}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{padding:8px 12px;font-size:14px}
.report h4{font-family:var(--display);font-size:20px;font-weight:700;margin:16px 0 6px}

<script>
const MUSCLES=["Pit","Esquena","Espatlles","Bíceps","Tríceps","Quàdriceps","Isquiotibials","Glutis","Bessons","Abdominals","Avantbraç","Altres"];
const VIEWS=["avui","pes","progres","setmana","any","nutricio","informes","clients","resum","rutines","pauta","fitxa"];
const ALIAS={registre:"avui",historial:"setmana"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const pad=n=>String(n).padStart(2,"0");
const isoOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayISO=()=>isoOf(new Date());
const dt=iso=>new Date(iso+"T12:00:00");
const fdate=(iso,o)=>dt(iso).toLocaleDateString("ca-ES",o||{weekday:"short",day:"numeric",month:"short"});
const num=v=>{if(v===""||v==null)return null;const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
const fn=(n,d=1)=>n==null||n===""?"–":Number(n).toLocaleString("ca-ES",{maximumFractionDigits:d});
const fin=v=>v===""||v==null?"":Number(v).toLocaleString("ca-ES",{maximumFractionDigits:2,useGrouping:false});
const e1rm=s=>(s.kg&&s.reps)?s.kg*(1+(s.reps+(s.rir||0))/30):0;
const weekStart=iso=>{const d=dt(iso);d.setDate(d.getDate()-((d.getDay()+6)%7));return isoOf(d)};
const addDays=(iso,n)=>{const d=dt(iso);d.setDate(d.getDate()+n);return isoOf(d)};
const fmtClock=sec=>{sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600);return (h?h+":":"")+pad(Math.floor(sec%3600/60))+":"+pad(sec%60)};
const fmtRest=sec=>{sec=Math.max(0,Math.ceil(sec));return Math.floor(sec/60)+":"+pad(sec%60)};
const fmtDur=sec=>{const m=Math.round(sec/60),h=Math.floor(m/60);return h?`${h} h ${m%60} min`:`${m} min`};
const effective=s=>s.rir==null||s.rir<=4;
const splitName=n=>{const p=String(n||"").split(" · ");return p.length>1?{tag:p[0],title:p.slice(1).join(" · ")}:{tag:"",title:n||"Sessió"}};

let db=null, cur="avui", chart=null, wchart=null, dirty=false, lastSaved=null, confirmDel=null, weekCursor=weekStart(todayISO()), sheetKind=null, progEx=null, showAll=false;
const S={exercises:[],sessions:[],templates:[],reports:[],bodyweight:[],targets:[],nutrition:[],kcallog:[],intake:[]};
const ready={exercises:false,sessions:false,templates:false,reports:false,bodyweight:false,targets:false,nutrition:false,kcallog:false,intake:false};
const newDraft=()=>({id:null,date:todayISO(),templateId:"",name:"",items:[],notes:"",cur:0});
let draft=LS.get("draft",null)||newDraft();
/* Esborrany de la sessió: es desa al mòbil i també al núvol (drafts/current) perquè no es perdi si es tanca l'app */
let draftT=null, draftBusy=false, draftAgain=false, draftPending=false;
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error("sense connexió")),ms))]);
function saveDraft(){ draft.savedAt=Date.now(); LS.set("draft",draft); if(draft.startedAt||draft.id){ clearTimeout(draftT); draftT=setTimeout(pushDraft,1200); } }
async function pushDraft(){
  clearTimeout(draftT); if(CV()) return; if(!db) {draftPending=true;return}
  if(draftBusy){draftAgain=true;return} draftBusy=true; draftAgain=false;
  const live=(draft.startedAt||draft.id)?draft:null;
  try{ await withTimeout(db.collection("drafts").doc("current").set({json:live?JSON.stringify(live):"",savedAt:draft.savedAt||Date.now()}),10000); draftPending=false }
  catch(e){ draftPending=true }
  draftBusy=false; if(draftAgain) pushDraft();
}
async function restoreDraft(){
  if(CV()) return;
  try{
    const s=await withTimeout(db.collection("drafts").doc("current").get(),8000); if(!s.exists) return;
    const r=s.data()||{}; const rAt=r.savedAt||0, lAt=draft.savedAt||0;
    if(r.json){ if(!(draft.startedAt||draft.id)||rAt>lAt){ draft=JSON.parse(r.json); draft.savedAt=rAt; LS.set("draft",draft); render(); toast("Sessió en curs recuperada"); if(draft.startedAt) wake(); } }
    else if((draft.startedAt||draft.id)&&lAt&&rAt>lAt){ draft=newDraft(); LS.set("draft",draft); render(); }
    else if((draft.startedAt||draft.id)&&rAt<lAt) pushDraft();
  }catch(e){}
}
/* Cua de desades: si no hi ha connexió, la sessió i el pes queden al mòbil i es pugen sols quan torna la connexió */
let pend=LS.get("pend",[]), flushing=false;
function queueWrite(col,id,data){ if(CV()&&col!=="drafts"){toast("Això només ho pot registrar el client");return} if(CV()) return; pend=pend.filter(w=>!(w.col===col&&w.id===id)); pend.push({col,id,data}); LS.set("pend",pend); mergePend(col); }
function mergePend(col){ if(!S[col]) return; pend.filter(w=>w.col===col).forEach(w=>{const i=S[col].findIndex(d=>d.id===w.id); const v={id:w.id,...w.data}; if(i>=0) S[col][i]=v; else S[col].push(v)}) }
async function flushPend(){
  if(!db||flushing||!pend.length){renderPend();return} flushing=true;
  for(const w of [...pend]){ try{ await withTimeout(db.collection(w.col).doc(w.id).set(w.data),12000); pend=pend.filter(x=>x!==w&&!(x.col===w.col&&x.id===w.id&&x.data===w.data)); LS.set("pend",pend) }catch(e){ break } }
  flushing=false; renderPend();
}
function renderPend(){
  const n=window.QStore?window.QStore.pendingCount():pend.filter(w=>w.col!=="drafts").length, el=$("#pend"); if(!el) return;
  el.innerHTML=n?`<div class="note" style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px"><span>⏳ ${n} registre${n>1?"s":""} desat${n>1?"s":""} al mòbil, pendent${n>1?"s":""} de pujar. Es pujaran sols quan tinguis connexió.</span><button id="pend-retry" style="padding:7px 12px;flex-shrink:0">Reintentar</button></div>`:"";
}
document.addEventListener("click",e=>{if(e.target.closest("#pend-retry")){ if(window.QStore) window.QStore.sync().then(renderPend); else flushPend() }});
if(window.QStore) window.QStore.on("_out",renderPend);
window.addEventListener("online",()=>{flushPend(); if(draftPending) pushDraft()});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"){ if(draft.startedAt||draft.id) pushDraft() } else { flushPend(); if(draftPending) pushDraft() } });
window.addEventListener("pagehide",()=>{ if(draft.startedAt||draft.id) pushDraft() });
setInterval(()=>{ if(pend.length) flushPend(); else if(draftPending&&(draft.startedAt||draft.id)) pushDraft() },45000);
const inWorkout=()=>!!(draft.startedAt||draft.id);

const exById=id=>S.exercises.find(e=>e.id===id);
const tplsSorted=()=>[...S.templates].sort((a,b)=>(a.order||0)-(b.order||0));
const sessionsSorted=()=>[...S.sessions].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.updatedAt||"").localeCompare(a.updatedAt||""));
function historyFor(exId,excludeId,n){const out=[];for(const s of sessionsSorted()){if(s.id===excludeId)continue;const it=(s.items||[]).find(i=>i.exId===exId);if(it){out.push({id:s.id,date:s.date,sets:it.sets||[]});if(out.length>=n)break}}return out}
const lastFor=(exId,excludeId)=>historyFor(exId,excludeId,1)[0]||null;

const r05=x=>Math.round(x*4)/4;
const exCfg=ex=>{const min=ex&&ex.repMin!=null?ex.repMin:8,max=ex&&ex.repMax!=null?ex.repMax:12;
  const inc=ex&&ex.inc!=null?ex.inc:(/manuel/i.test(ex&&ex.name||"")?2:2.5);
  const ranges=ex&&Array.isArray(ex.ranges)&&ex.ranges.length?ex.ranges:null;
  return {min,max,inc,ranges,rng:j=>ranges?(ranges[j]||ranges[ranges.length-1]):{min,max}}};
const rngStr=(c,sep)=>c.ranges?c.ranges.map(r=>r.min+"–"+r.max).join(sep||" · "):c.min+"–"+c.max;
/* Doble progressió: totes les sèries al màxim del rang → puja; si no, +1 rep. Màxim MAXUPS pujades per sessió.
   Si l'entrenador ha deixat un pla per a l'exercici basat en l'última sessió, aquest pla mana. */
const MAXUPS=3;
function suggest(exId,excludeId,noUp){
  const c=exCfg(exById(exId)); const a=lastFor(exId,excludeId); if(!a||!a.sets.length) return null;
  const n=c.ranges?c.ranges.length:a.sets.length;
  const atMax=a.sets.every((x,j)=>x.kg!=null&&x.reps!=null&&x.reps>=c.rng(j).max);
  let kind=atMax?"up":"reps"; if(kind==="up"&&noUp) kind="hold";
  const sets=Array.from({length:n},(_,j)=>{const x=a.sets[j],r=c.rng(j);
    if(!x||x.kg==null) return {kg:null,reps:r.min};
    if(kind==="up") return {kg:r05(x.kg+c.inc),reps:r.min,up:true};
    if(kind==="hold") return {kg:x.kg,reps:r.max};
    return {kg:x.kg,reps:Math.min(r.max,Math.max(r.min,(x.reps||0)+1))};});
  return {sets,kind};
}
function coachTarget(exId,excludeId){
  const t=S.targets.find(x=>x.id===exId); if(!t||!Array.isArray(t.sets)) return null;
  const a=lastFor(exId,excludeId);
  return (a?t.basedOn===a.id:t.basedOn==="none")?t:null;
}
function planSession(exIds,excludeId){
  const out={}, cands=[];
  exIds.forEach((id,k)=>{
    const t=coachTarget(id,excludeId); if(t){out[id]={sets:t.sets,src:"coach",note:t.note||""};return}
    const g=suggest(id,excludeId); if(!g){out[id]=null;return}
    out[id]={sets:g.sets,src:"rule",kind:g.kind}; if(g.kind==="up") cands.push({id,k});
  });
  cands.slice(MAXUPS).forEach(c=>{const g=suggest(c.id,excludeId,true);out[c.id]={sets:g.sets,src:"rule",kind:"hold"}});
  return out;
}
function planDir(id,p,excludeId){
  if(!p||!p.sets) return "";
  const a=lastFor(id,excludeId); if(!a) return "";
  let up=false,dn=false; p.sets.forEach((x,j)=>{const y=a.sets[j]; if(!y||x.kg==null||y.kg==null) return; if(x.kg>y.kg+0.01) up=true; if(x.kg<y.kg-0.01) dn=true});
  return dn?"down":up?"up":"same";
}
function setsFromPlan(p,id){
  if(p&&p.sets&&p.sets.length) return p.sets.map(x=>({kg:x.kg??"",reps:x.reps??"",rir:0,done:false,t:true}));
  const c=exCfg(exById(id)); return Array.from({length:c.ranges?c.ranges.length:3},(_,j)=>({kg:"",reps:"",rir:0,done:false,t:true}));
}
const newSetsFor=id=>setsFromPlan(planSession([id],draft.id)[id],id);
const bestE1=sets=>Math.max(0,...(sets||[]).map(e1rm));
const setStr=s=>`${fn(s.kg,2)}×${s.reps??"–"}${s.rir?` @${s.rir}`:""}`;
const vol=sets=>(sets||[]).reduce((a,z)=>a+(z.kg||0)*(z.reps||0),0);

function setStatus(msg){ $("#status").innerHTML=msg?`<div class="note">${esc(msg)}</div>`:""; }
let toastT; function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}

function nextTemplate(tpls){
  if(!tpls.length) return null;
  const last=sessionsSorted().find(s=>s.templateId&&tpls.some(t=>t.id===s.templateId));
  if(!last) return tpls[0];
  const i=tpls.findIndex(t=>t.id===last.templateId); return tpls[(i+1)%tpls.length];
}
function loadTemplate(tp){
  draft.templateId=tp.id; draft.name=tp.name; draft.date=todayISO(); draft.cur=0;
  const pl=planSession(tp.exIds||[],null); draft.items=(tp.exIds||[]).map(id=>({exId:id,sets:setsFromPlan(pl[id],id)}));
}
function autoLoad(){
  if(inWorkout()||draft.manual||draft.touched) return;
  if(!ready.templates||!ready.sessions||!ready.targets) return;
  const n=nextTemplate(tplsSorted()); if(!n) return;
  const sig=JSON.stringify([n.id,planSession(n.exIds||[],null)]);
  if(draft.sig===sig&&draft.items.length&&draft.date===todayISO()) return;
  draft.sig=sig; loadTemplate(n); saveDraft();
}

function exState(it){const n=it.sets.length,d=it.sets.filter(s=>s.done).length;return n&&d===n?"done":d?"part":""}
function renderWorkout(){

  const it=draft.items[i], ex=exById(it.exId)||{name:it.name||"Exercici",muscle:"Altres"}, c=exCfg(ex), pp=plan[it.exId], prev=lastFor(it.exId,draft.id), d=planDir(it.exId,pp,draft.id);
  const why=!pp?"":pp.src==="coach"?`<b>Pla de l'entrenador.</b> ${esc(pp.note||"")}`:pp.kind==="up"?`<b>↑ Puja +${fn(c.inc,2)} kg.</b> Vas arribar al màxim del rang a totes les sèries.`:pp.kind==="hold"?`<b>Mantén la càrrega.</b> Avui ja en pugen altres.`:`<b>Mateixa càrrega.</b> Busca +1 rep a cada sèrie fins al màxim del rang.`;
  let h=`<div class="wo stack">
   <div class="seg">${draft.items.map((x,k)=>`<button data-act="go" data-k="${k}" class="${k===i?"cur":exState(x)}" aria-label="Exercici ${k+1}"></button>`).join("")}</div>
   ${ex.photo?`<button class="photo has" data-act="photo" aria-label="Foto de ${esc(ex.name)}"><img src="${esc(ex.photo)}" alt=""></button>`:`<button class="photo small" data-act="photo">＋ Afegeix una foto de la màquina</button>`}
   <div class="exhead"><div><span class="lbl">Exercici ${i+1} de ${n}</span><h2>${esc(ex.name)}</h2><span class="chip">${esc(ex.muscle||"")}</span></div><button class="plain" data-act="opts" aria-label="Opcions de l'exercici" style="font-size:22px;line-height:1">⋯</button></div>

   <div class="sets"><div class="sethead"><span>Sèrie</span><span>kg</span><span>Reps</span><span></span></div>
   ${it.sets.map((s,j)=>{const r=c.rng(j);return `<div class="setrow ${s.done?"done":""}" data-s="${j}">
      <div class="sn"><b>${j+1}</b><small>${r.min}–${r.max}</small><button data-act="rir" class="${s.rir?"on":""}" aria-label="RIR">RIR ${s.rir||0}</button></div>

      <button class="chk" data-act="chk" aria-label="Sèrie ${j+1} feta">✓</button>${s.done?cmpHTML(it.exId,j,s,lastChk&&lastChk.i===i&&lastChk.j===j):""}</div>`}).join("")}
   </div>
   <div class="row"><button class="ghost" data-act="addset">+ Sèrie</button>${it.sets.length>1?`<button class="ghost" data-act="rmset">− Treure l'última</button>`:""}</div>

let lastChk=null;
function cmpHTML(exId,j,s,fresh){
  const kg=num(s.kg), reps=num(s.reps); if(kg==null||reps==null) return "";
  const prevAll=S.sessions.filter(o=>o.id!==draft.id).flatMap(o=>(o.items||[]).filter(i=>i.exId===exId).flatMap(i=>i.sets));
  const e=e1rm({kg,reps,rir:num(s.rir)||0}), best=prevAll.length?bestE1(prevAll):0;
  const a=lastFor(exId,draft.id), p=a&&a.sets[j];
  let txt="", cls="";
  if(!p) txt="Primera vegada";
  else{
    const dk=Math.round((kg-(p.kg||0))*100)/100, dr=reps-(p.reps||0), rmin=exCfg(exById(exId)).rng(j).min;
    if(Math.abs(dk)<0.01){ txt=dr>0?`+${dr} rep${dr>1?"s":""} vs l'última`:dr<0?`${dr} rep${dr<-1?"s":""} vs l'última`:"Igual que l'última"; cls=dr>0?"up":dr<0?"down":""; }
    else if(dk>0){ txt=`+${fn(dk,2)} kg · ${reps} reps (última ${fn(p.kg,2)}×${p.reps})`+(reps<rmin?" · per sota del rang":""); cls=reps>=rmin?"up":"down"; }
    else { txt=`${fn(dk,2)} kg · ${reps} reps (última ${fn(p.kg,2)}×${p.reps})`; const pe=e1rm(p); cls=e>pe+0.05?"up":e<pe-0.05?"down":""; }
  }
  const pr=best&&e>best+0.05;
  return `<div class="cmp ${pr?"up":cls} ${fresh?"pop":""}">${pr?'<span class="pr">🏆 RÈCORD</span>':cls==="up"?"↑":cls==="down"?"↓":"="} ${esc(txt)}</div>`;
}
function woInput(e){
  const t=e.target, row=t.closest(".setrow"); if(!row||!t.dataset.f) return;
  const s=draft.items[draft.cur].sets[+row.dataset.s]; s[t.dataset.f]=num(t.value)??""; s.t=false; t.classList.remove("t"); draft.touched=true; saveDraft();
}
async function woClick(e,b){
  const act=b.dataset.act; const it=draft.items[draft.cur]; const row=b.closest(".setrow"); const j=row?+row.dataset.s:-1; const c=exCfg(exById(it&&it.exId));
  switch(act){
    case "go": draft.cur=+b.dataset.k; break;
    case "inc": case "dec":{ const s=it.sets[j], f=b.dataset.f, step=f==="kg"?(c.inc||2.5):1;
      let v=num(s[f]); if(v==null){ v=f==="kg"?(num(it.sets[j-1]&&it.sets[j-1].kg)||0):c.rng(j).min; } else v=v+(act==="inc"?step:-step);
      s[f]=f==="kg"?Math.max(0,r05(v)):Math.max(0,Math.round(v)); s.t=false; draft.touched=true; break }
    case "rir":{ const s=it.sets[j]; s.rir=((s.rir||0)+1)%5; break }
    case "chk":{ const s=it.sets[j]; unlockAudio();
      if(!s.done&&(num(s.kg)==null||num(s.reps)==null)){toast("Posa kg i reps abans de marcar");return}
      s.done=!s.done; s.t=false; draft.touched=true; lastChk=s.done?{i:draft.cur,j}:null;
      if(s.done){ const last=draft.cur===draft.items.length-1&&it.sets.every(x=>x.done); if(!last) startRest(c.rng(j).max<=5?150:restDefault()); }
      break }
    case "addset":{ const l=it.sets[it.sets.length-1]||{}; it.sets.push({kg:l.kg??"",reps:l.reps??"",rir:0,done:false,t:true}); break }
    case "rmset": it.sets.pop(); break;
    case "photo":{ const ex=exById(it.exId); if(!ex) return; photoTarget=ex.id;
      if(ex.photo){$("#lb-img").src=ex.photo;$("#lb-name").textContent=ex.name;$("#lb").hidden=false} else $("#photo-in").click(); return }
    case "opts": openSheet("opts"); return;
    default: return;
  }
  saveDraft(); render();
}

let actx=null;

function exHistory(exId){
  return [...S.sessions].filter(s=>(s.items||[]).some(i=>i.exId===exId)).sort((a,b)=>a.date.localeCompare(b.date))
    .map(s=>{const sets=s.items.filter(i=>i.exId===exId).flatMap(i=>i.sets);return {date:s.date,sets,e1:bestE1(sets),top:Math.max(0,...sets.map(x=>x.kg||0)),vol:vol(sets)}});
}
function spark(vals){
  if(vals.length<2) return `<svg viewBox="0 0 84 30"></svg>`;
  const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>[2+i*(80/(vals.length-1)),27-((v-mn)/r)*24]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" "); const l=pts[pts.length-1];
  return `<svg viewBox="0 0 84 30" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="3" fill="var(--accent)"/></svg>`;
}
function renderProgres(){

function kcalStats(){
  const logs=[...S.kcallog].filter(x=>x.date&&x.kcal).sort((a,b)=>a.date.localeCompare(b.date)), t=todayISO();
  const w7=logs.filter(x=>x.date>addDays(t,-7)&&x.date<=t);
  const avg7=w7.length?w7.reduce((a,b)=>a+b.kcal,0)/w7.length:null;
  const from=addDays(t,-28), L=logs.filter(x=>x.date>from), B=bwData().filter(x=>x.date>from);
  let maint=null;
  if(L.length>=14&&B.length>=14){
    const t0=dt(B[0].date).getTime()/864e5, xs=B.map(x=>dt(x.date).getTime()/864e5-t0), ys=B.map(x=>x.kg);
    const mx=xs.reduce((a,b)=>a+b,0)/xs.length, my=ys.reduce((a,b)=>a+b,0)/ys.length;
    const slope=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/xs.reduce((a,x)=>a+(x-mx)**2,0);
    maint=L.reduce((a,b)=>a+b.kcal,0)/L.length-slope*7700;
  }
  return {avg7,n7:w7.length,maint,nL:L.length};
}

  h+=`<div class="mac"><div class="tile k"><div class="lbl">Kcal</div><div class="v">${fn(tg.kcal,0)}</div></div><div class="tile p"><div class="lbl">Proteïna</div><div class="v">${fn(tg.p,0)}<small> g</small></div></div>
    <div class="tile c"><div class="lbl">Hidrats</div><div class="v">${fn(tg.c,0)}<small> g</small></div></div><div class="tile g"><div class="lbl">Greixos</div><div class="v">${fn(tg.g,0)}<small> g</small></div></div></div>`;
  if(P===act) h+=`<div class="card stack"><span class="lbl">Kcal d'avui · també l'àpat lliure</span>
    <div class="row" style="align-items:center"><div class="step" style="flex:2 1 180px"><button data-kc="-50" aria-label="Menys">−</button><input id="n-kcal" inputmode="numeric" value="${lg?lg.kcal:""}" placeholder="${fn(tg.kcal,0).replace(/\s/g,"")}"><button data-kc="50" aria-label="Més">+</button></div>
    <button class="primary" id="n-save" style="flex:1 1 100px;height:50px">${lg?"Actualitzar":"Desar"}</button></div>
    <label class="chkl"><input type="checkbox" id="n-free" ${lg&&lg.free?"checked":""}> Avui he fet l'àpat lliure</label>
    <div class="sub num">Mitjana 7 dies: <b>${st.avg7?fn(st.avg7,0)+" kcal":"–"}</b> · ${st.n7}/7 dies registrats${st.avg7&&tg.kcal?` · ${st.avg7-tg.kcal>0?"+":""}${fn(st.avg7-tg.kcal,0)} vs pauta`:""}</div>
    <div class="sub num">Manteniment estimat: <b>${st.maint?fn(Math.round(st.maint/10)*10,0)+" kcal":"calen 14 dies de registre ("+st.nL+"/14)"}</b></div></div>`;
  (P.meals||[]).forEach(m=>{
    h+=`<div class="card meal"><div class="mh"><h3>${esc(m.name)}${m.note?` <span class="lbl" style="font-family:var(--body)">· ${esc(m.note)}</span>`:""}</h3><span class="mm">${fn(m.kcal,0)} kcal · P ${fn(m.p,0)} · HC ${fn(m.c,0)} · G ${fn(m.g,0)}</span></div>
     ${(m.items||[]).map((it,k)=>{const can=!!eqRowsFor(it);return `<button class="food ${can?"":"noeq"}" ${can?`data-eq="${esc(m.name)}|${k}"`:""}><span style="min-width:0"><b>${esc(it.name)}</b>${it.hint?`<div class="sub" style="font-size:13px">${esc(it.hint)}</div>`:""}</span><span class="fg">${fn(it.g,0)}<small style="font-size:14px;color:var(--muted)"> g</small></span><span class="ar">${can?"›":""}</span></button>`}).join("")}</div>`});
  h+=`<p class="sub" style="font-size:13px">Toca un aliment per veure'n les equivalències. Pesos en cru.</p>`;
  if(P.supplements&&P.supplements.length) h+=`<details class="card"><summary>Suplements</summary><div class="tw"><table><tbody>${P.supplements.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.txt)}</td></tr>`).join("")}</tbody></table></div></details>`;
  if(P.tips&&P.tips.length) h+=`<details class="card"><summary>Consells generals</summary><ul class="tips">${P.tips.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`;
  if(P===act){
    const bw={}; bwData().forEach(x=>bw[x.date]=x.kg);
    const days=Array.from({length:14},(_,i)=>addDays(today,-i));
    h+=`<div class="card tw" style="padding:6px 10px"><table><thead><tr><th>Dia</th><th class="r">Kcal</th><th class="r">Lliure</th><th class="r">Pes</th></tr></thead><tbody>

  }
  el.innerHTML=h+`</div>`;
}
$("#v-nutricio").addEventListener("click",async e=>{

  if(b.id==="n-toggle"){nutShow=nutShow==="next"?null:"next";renderNutricio();window.scrollTo(0,0);return}

  if(b.dataset.eq){const [mn,k]=b.dataset.eq.split("|");const P=(nutShow==="next"&&nextPauta())||activePauta();const m=(P.meals||[]).find(x=>x.name===mn);if(!m)return;eqItem=m.items[+k];openSheet("eq");return}

    catch(err){b.disabled=false;toast("No s'ha pogut desar: "+err.message)}
  }
});

/* ---------- INFORMES ---------- */
function md(t){
  const lines=esc(t).split(/\n/); let out="",list=false,tbl=[];
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  const flushT=()=>{ if(!tbl.length) return; const rows=tbl.filter(r=>!/^\|?\s*:?-{2,}/.test(r)).map(r=>r.replace(/^\||\|$/g,"").split("|").map(c=>inl(c.trim())));
    out+=`<div class="tw"><table><thead><tr>${rows[0].map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; tbl=[]; };
  for(const l of lines){
    if(/^\s*\|/.test(l)){ if(list){out+="</ul>";list=false} tbl.push(l.trim()); continue } flushT();
    if(/^\s*[-•]\s+/.test(l)){ if(!list){out+="<ul>";list=true} out+="<li>"+inl(l.replace(/^\s*[-•]\s+/,""))+"</li>"; continue }
    if(list){out+="</ul>";list=false}
    if(/^#{1,4}\s+/.test(l)) out+="<h4>"+inl(l.replace(/^#+\s+/,""))+"</h4>"; else if(l.trim()) out+="<p>"+inl(l)+"</p>";
  }
  flushT(); if(list) out+="</ul>"; return out;
}
function renderInformes(){
  const el=$("#v-informes"); const list=[...S.reports].sort((a,b)=>(b.week||"").localeCompare(a.week||""));
  el.innerHTML=`<div class="stack">${liveBanner()}<div class="vhead"><span class="lbl">Setmanals</span><h1>Informes</h1></div>${autoReportCard()}${
    list.length?list.map(r=>`<article class="card report"><span class="lbl">Setmana del ${esc(r.week?fdate(r.week,{day:"numeric",month:"long"}):"–")}</span><h3 style="margin:4px 0 6px">${esc(r.title||"Informe setmanal")}</h3>${md(r.text||"")}</article>`).join("")
    :`<p class="sub" style="font-size:13px">A sota hi apareixeran els informes comentats per l'entrenador.</p>`}</div>`;
}

/* ---------- RELLOTGE I ARRENCADA ---------- */
function tick(){
  if(draft.startedAt&&!draft.id){const t=fmtClock((Date.now()-Date.parse(draft.startedAt))/1000);["#clk","#clk2","#clk3"].forEach(s=>{const e=$(s);if(e)e.textContent=t})}
  const r=$("#rest"), show=cur==="avui"&&inWorkout()&&!lastSaved&&draft.restEnd;
  if(!show){r.hidden=true;return}
  const left=(draft.restEnd-Date.now())/1000;
  if(left<=-8){draft.restEnd=null;saveDraft();r.hidden=true;return}
  if(left<=0){ if(!draft.restBeeped){draft.restBeeped=true;saveDraft();beep()}
    r.className="rest end"; r.innerHTML=`<span><span class="l">Descans</span><br><span class="t">Endavant!</span></span><button data-r="skip">Tancar</button>`; }
  else { r.className="rest"; r.innerHTML=`<span><span class="l">Descans</span><br><span class="t">${fmtRest(left)}</span></span><button data-r="add">+15 s</button><button data-r="skip">Saltar</button>`; }
  r.hidden=false;
}
setInterval(tick,500);
if(draft.startedAt) wake();
route(); renderPend();
if(window.QStore) QStore.on("_view",()=>{ lastSaved=null; progEx=null; nutShow=null; repWeek=null; pe=null; Object.keys(S).forEach(k=>S[k]=[]); route(); });
(async()=>{
  const timer=setTimeout(()=>setStatus("Encara no es poden carregar les dades. Revisa la connexió; el que vegis pot no estar actualitzat."),10000);
  try{ db=window.qapp&&window.qapp.use?await window.qapp.use("db"):null }catch(e){db=null}

  const sub=(col,order)=>{let q=db.collection(col); if(order) q=q.orderBy(order[0],order[1]);
    q.onSnapshot(snap=>{S[col]=snap.docs.map(d=>({id:d.id,...d.data()})); mergePend(col);
      if(!snap.metadata.fromCache){ready[col]=true; if(Object.values(ready).every(Boolean)){clearTimeout(timer);setStatus("")}}
      if(col==="intake"&&needIntake()&&cur!=="fitxa"){location.hash="fitxa";return}
      if(sheetKind) return; render();},
    err=>{clearTimeout(timer);setStatus("No s'han pogut carregar les dades ("+col+"): "+err.message)});};
  restoreDraft(); flushPend();
  sub("exercises"); sub("sessions",["date","desc"]); sub("templates"); sub("reports",["week","desc"]); sub("bodyweight",["date","desc"]); sub("targets"); sub("nutrition"); sub("kcallog",["date","desc"]); sub("intake");
})();
